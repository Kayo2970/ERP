<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="passShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="#0b0f19"/>

  <!-- Left: Explanatory Callouts -->
  <text x="50" y="70" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold">Digital Wallet Pass Integration</text>
  <text x="50" y="100" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Real-time dynamic passes for Apple Wallet (.pkpass) and Google Wallet</text>

  <g font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
    <rect x="50" y="140" width="380" height="85" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="170" fill="#f8fafc" font-weight="bold">📱 Zero-Install Mobile Pass</text>
    <text x="70" y="195" fill="#94a3b8">Attendees add pass directly to iPhone or Android lockscreen.</text>
    <text x="70" y="212" fill="#94a3b8">No separate mobile app download required.</text>

    <rect x="50" y="245" width="380" height="85" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="275" fill="#f8fafc" font-weight="bold">🔄 Dynamic Push Updates</text>
    <text x="70" y="300" fill="#94a3b8">If event venue, timing, or seat changes, pass pushes</text>
    <text x="70" y="317" fill="#94a3b8">silent update notification directly to device.</text>

    <rect x="50" y="350" width="380" height="85" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="380" fill="#f8fafc" font-weight="bold">⚡ High-Speed Kiosk Recognition</text>
    <text x="70" y="405" fill="#94a3b8">High-density PDF417 / Aztec 2D barcode decodes in &lt;150ms</text>
    <text x="70" y="422" fill="#94a3b8">at Live Scanner Kiosks even in low-light environments.</text>
  </g>

  <!-- Right: High-Fidelity Apple Wallet Pass Visual Mockup -->
  <g transform="translate(480, 45)" filter="url(#passShadow)">
    <!-- Pass Body -->
    <rect width="360" height="510" rx="20" fill="url(#passGrad)" stroke="#4338ca" stroke-width="2"/>
    
    <!-- Pass Header -->
    <circle cx="35" cy="35" r="14" fill="#38bdf8"/>
    <text x="35" y="41" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle">L</text>
    <text x="60" y="35" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">LEADS ERP • MSRUAS</text>
    <text x="60" y="48" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="10">OFFICIAL EVENT PASS</text>
    <text x="330" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="end">VIP ACCESS</text>

    <!-- Event Banner Area -->
    <rect x="20" y="65" width="320" height="1" fill="#334155"/>
    <text x="25" y="95" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">EVENT</text>
    <text x="25" y="120" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">AI Innovators Conclave</text>
    
    <!-- Field Row 1 -->
    <text x="25" y="160" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">DATE &amp; TIME</text>
    <text x="25" y="180" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">15 OCT 2026, 09:00 AM</text>

    <text x="200" y="160" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">VENUE</text>
    <text x="200" y="180" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Auditorium West, Hall A</text>

    <!-- Field Row 2 -->
    <text x="25" y="215" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">ATTENDEE NAME</text>
    <text x="25" y="235" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Dr. Rajeshwari Nair</text>

    <text x="200" y="215" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">SEAT / TIER</text>
    <text x="200" y="235" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Row A - 04 (Faculty)</text>

    <!-- Perforation Dots -->
    <line x1="20" y1="265" x2="340" y2="265" stroke="#334155" stroke-dasharray="6 6" stroke-width="2"/>

    <!-- Barcode Container -->
    <rect x="35" y="290" width="290" height="150" rx="10" fill="#ffffff"/>
    
    <!-- Barcode Visual Representation (PDF417 / Aztec Simulation) -->
    <g transform="translate(55, 305)">
      <!-- Mock Barcode Grid -->
      <rect x="0" y="0" width="250" height="90" fill="#000000"/>
      <!-- Internal code stripes -->
      <line x1="20" y1="0" x2="20" y2="90" stroke="#fff" stroke-width="4"/>
      <line x1="35" y1="0" x2="35" y2="90" stroke="#fff" stroke-width="8"/>
      <line x1="55" y1="0" x2="55" y2="90" stroke="#fff" stroke-width="3"/>
      <line x1="75" y1="0" x2="75" y2="90" stroke="#fff" stroke-width="12"/>
      <line x1="105" y1="0" x2="105" y2="90" stroke="#fff" stroke-width="6"/>
      <line x1="130" y1="0" x2="130" y2="90" stroke="#fff" stroke-width="10"/>
      <line x1="155" y1="0" x2="155" y2="90" stroke="#fff" stroke-width="4"/>
      <line x1="180" y1="0" x2="180" y2="90" stroke="#fff" stroke-width="8"/>
      <line x1="210" y1="0" x2="210" y2="90" stroke="#fff" stroke-width="14"/>
      
      <text x="125" y="115" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LEADS-PK-9812-7719-VIP</text>
    </g>

    <!-- Bottom Wallet Footer -->
    <text x="180" y="480" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Add to Apple Wallet | Verified Cryptographic Signature</text>
  </g>
</svg>
