  <rect x="730" y="470" width="80" height="28" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1"/>
  <text x="770" y="488" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PLANNING</text>

