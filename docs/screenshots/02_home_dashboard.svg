  <text x="865" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Viewing As:</text>
  <text x="940" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Super User ▾</text>

