  <!-- Stat Cards Row -->
  <!-- Card 1 -->
  <rect x="270" y="95" width="210" height="105" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="290" y="125" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">ACTIVE EVENTS</text>
  <text x="290" y="165" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="32" font-weight="800">12</text>
  <text x="290" y="185" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">↑ 3 scheduled this week</text>

  <!-- Card 2 -->
  <rect x="505" y="95" width="210" height="105" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="525" y="125" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PENDING APPROVALS</text>
  <text x="525" y="165" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="32" font-weight="800">7</text>
  <text x="525" y="185" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11">4 financial &amp; 3 procurement</text>

  <!-- Card 3 -->
  <rect x="740" y="95" width="210" height="105" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="760" y="125" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">WALLET PASSES SCANNED</text>
  <text x="760" y="165" fill="#10b981" font-family="-apple-system, sans-serif" font-size="32" font-weight="800">1,482</text>
  <text x="760" y="185" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Across 4 live kiosks</text>

  <!-- Card 4 -->
  <rect x="975" y="95" width="200" height="105" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="995" y="125" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">TOTAL BUDGET SPENT</text>
  <text x="995" y="165" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">₹3,42,150</text>
  <text x="995" y="185" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Within allocated ceiling</text>

  <!-- Two Column Content -->
  <!-- Left Big Card: Live Event Status & Check-ins -->
  <rect x="270" y="225" width="580" height="445" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="295" y="260" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Upcoming &amp; Live Events</text>
  
  <!-- Event Row 1 -->
  <rect x="295" y="280" width="530" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="315" y="310" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">LEADS AI Innovators Conclave 2026</text>
