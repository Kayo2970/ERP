  <!-- Sidebar Brand -->
  <rect x="20" y="20" width="36" height="36" rx="8" fill="#38bdf8"/>
  <text x="38" y="44" fill="#0f172a" font-family="-apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">L</text>
  <text x="68" y="38" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">LEADS ERP</text>
  <text x="68" y="52" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">MSRUAS Next-Gen</text>

  <!-- Navigation Links -->
  <g font-family="-apple-system, sans-serif" font-size="13" font-weight="500">
    <!-- Active Link: Dashboard -->
    <rect x="12" y="80" width="216" height="38" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="32" cy="99" r="6" fill="#38bdf8"/>
    <text x="50" y="103" fill="#38bdf8" font-weight="600">Home Dashboard</text>

    <!-- Other Links -->
    <text x="50" y="145" fill="#94a3b8">📅 Events &amp; Passes</text>
    <text x="50" y="185" fill="#94a3b8">✅ Task Management</text>
    <text x="50" y="225" fill="#94a3b8">💰 Financial Reimbursements</text>
    <text x="50" y="265" fill="#94a3b8">📊 Budgeting &amp; P&amp;L</text>
    <text x="50" y="305" fill="#94a3b8">🎨 Design Proofreader</text>
    <text x="50" y="345" fill="#94a3b8">📝 Dynamic Form Builder</text>
    <text x="50" y="385" fill="#94a3b8">💳 Digital Visiting Cards</text>
    <text x="50" y="425" fill="#94a3b8">🤝 Unified Approvals</text>
    <text x="50" y="465" fill="#94a3b8">👥 Members &amp; RBAC</text>
    <text x="50" y="505" fill="#94a3b8">⚙️ System &amp; Backups</text>
  </g>

  <!-- User Profile Badge (Bottom Sidebar) -->
  <rect x="12" y="630" width="216" height="54" rx="8" fill="#1e293b"/>
  <circle cx="38" cy="657" r="16" fill="#6366f1"/>
  <text x="38" y="662" fill="#fff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SA</text>
  <text x="64" y="650" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Dr. System Admin</text>
  <text x="64" y="666" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">● Tier 1 (Super User)</text>

  <!-- Top App Header -->
