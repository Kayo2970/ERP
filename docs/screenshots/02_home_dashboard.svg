  <text x="890" y="260" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Urgent Sign-Offs</text>

  <!-- Approval Item 1 -->
  <rect x="890" y="280" width="265" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="905" y="305" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Reimbursement #RB-9021</text>
  <text x="905" y="325" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Catering Expenses • ₹14,200</text>
  <text x="905" y="342" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Claimant: Rahul Sharma</text>
  <rect x="905" y="352" width="70" height="22" rx="4" fill="#10b981"/>
  <text x="940" y="367" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Approve</text>
  <rect x="985" y="352" width="70" height="22" rx="4" fill="#ef4444"/>
  <text x="1020" y="367" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Reject</text>

  <!-- Approval Item 2 -->
  <rect x="890" y="395" width="265" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="905" y="420" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Procurement #PR-4412</text>
  <text x="905" y="440" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">3x Wireless Microphones • ₹28,500</text>
  <text x="905" y="457" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Vendor: AudioCraft Solutions</text>
  <rect x="905" y="467" width="70" height="22" rx="4" fill="#10b981"/>
  <text x="940" y="482" fill="#fff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Approve</text>
  <rect x="985" y="467" width="70" height="22" rx="4" fill="#334155"/>
  <text x="1020" y="482" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Review</text>
</svg>
