  <rect x="730" y="300" width="80" height="28" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
  <text x="770" y="318" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE</text>

  <!-- Event Row 2 -->
  <rect x="295" y="365" width="530" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="315" y="395" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Faculty Research Symposium</text>
  <text x="315" y="417" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Seminar Hall 2 • Oct 22, 2026 • 120 Delegates Confirmed</text>
  <rect x="730" y="385" width="80" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
  <text x="770" y="403" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">UPCOMING</text>

