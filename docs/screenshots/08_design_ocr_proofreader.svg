<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <linearGradient id="ocrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1100" height="650" rx="12" fill="url(#ocrBg)"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="1100" height="60" fill="#1e293b"/>
  <text x="30" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="800" font-size="18">Design Portal &amp; AI Optical Proofreader</text>
  
  <rect x="760" y="15" width="140" height="30" rx="6" fill="#334155"/>
  <text x="830" y="35" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Engine: Tesseract + nspell</text>

  <rect x="915" y="15" width="155" height="30" rx="6" fill="#10b981"/>
  <text x="992" y="35" fill="#fff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Approve For Print</text>

  <!-- Left: Uploaded Poster Preview with OCR Bounding Boxes -->
  <rect x="30" y="80" width="580" height="540" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="115" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Uploaded Poster Preview: conclave_banner_v3.png</text>

  <!-- Simulated Poster Canvas -->
  <rect x="50" y="135" width="540" height="465" rx="8" fill="#020617" stroke="#475569"/>
  
  <!-- Poster Artwork Simulation -->
  <rect x="70" y="155" width="500" height="120" rx="6" fill="#312e81"/>
  <text x="320" y="210" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" text-anchor="middle">AI INNOVATION SUMMIT 2026</text>
  <text x="320" y="235" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">M.S. RAMAIAH UNIVERSITY OF APPLIED SCIENCES</text>

  <!-- Body with Bounding Box Annotations -->
  <!-- Detected Text OK -->
  <rect x="90" y="300" width="220" height="40" rx="4" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="100" y="325" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Auditorium West, Campus</text>
  <rect x="270" y="292" width="40" height="16" rx="3" fill="#10b981"/>
  <text x="290" y="304" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OK</text>

  <!-- Detected Text ERROR (Spelling Issue) -->
  <rect x="90" y="360" width="290" height="40" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="385" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="13">Registration Deadline: Octobrr 10</text>
  <rect x="330" y="352" width="50" height="16" rx="3" fill="#ef4444"/>
  <text x="355" y="364" fill="#fff" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">TYPO</text>

  <!-- Right: OCR Findings & Proofreading Report -->
  <rect x="630" y="80" width="440" height="540" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="655" y="115" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">OCR Spellcheck Diagnostics</text>

  <!-- Stats -->
  <g font-family="-apple-system, sans-serif">
    <rect x="655" y="135" width="120" height="60" rx="6" fill="#0f172a"/>
    <text x="670" y="160" fill="#94a3b8" font-size="11">CONFIDENCE</text>
    <text x="670" y="185" fill="#10b981" font-size="18" font-weight="bold">97.8%</text>

    <rect x="790" y="135" width="120" height="60" rx="6" fill="#0f172a"/>
    <text x="805" y="160" fill="#94a3b8" font-size="11">WORDS READ</text>
    <text x="805" y="185" fill="#38bdf8" font-size="18" font-weight="bold">142</text>

    <rect x="925" y="135" width="120" height="60" rx="6" fill="#0f172a"/>
    <text x="940" y="160" fill="#94a3b8" font-size="11">FLAGS FOUND</text>
    <text x="940" y="185" fill="#ef4444" font-size="18" font-weight="bold">1 Typo</text>
  </g>

  <!-- Error Card -->
  <rect x="655" y="215" width="390" height="150" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="675" y="245" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">⚠️ Detected Spelling Error in Line 4</text>
  
  <text x="675" y="275" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Detected Token:</text>
  <text x="785" y="275" fill="#fca5a5" font-family="monospace" font-size="13" font-weight="bold">"Octobrr"</text>

  <text x="675" y="305" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Dictionary Match:</text>
  <text x="785" y="305" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">"October"</text>

  <rect x="675" y="325" width="150" height="26" rx="4" fill="#334155"/>
  <text x="750" y="342" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Add to Custom Dict</text>

  <rect x="835" y="325" width="190" height="26" rx="4" fill="#ef4444"/>
  <text x="930" y="342" fill="#fff" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reject &amp; Request Revision</text>

  <!-- Institutional Checklist -->
  <text x="655" y="395" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Pre-Print Institutional Compliance</text>
  <g font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">
    <text x="655" y="425" fill="#10b981">☑ MSRUAS Official Logo Present &amp; High Res</text>
    <text x="655" y="455" fill="#10b981">☑ Color Palette Meets University Brand Guidelines</text>
    <text x="655" y="485" fill="#10b981">☑ QR Code Passes Visual Decode Test</text>
    <text x="655" y="515" fill="#f59e0b">☐ Faculty Advisor Written Sign-off (Pending)</text>
  </g>
</svg>
