<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <linearGradient id="formBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1100" height="650" rx="12" fill="url(#formBg)"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="1100" height="60" fill="#1e293b"/>
  <text x="30" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="800" font-size="18">Dynamic Form Builder &amp; Public Registrations</text>
  
  <rect x="740" y="15" width="150" height="30" rx="6" fill="#334155"/>
  <text x="815" y="35" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔗 View Public URL</text>

  <rect x="910" y="15" width="160" height="30" rx="6" fill="#10b981"/>
  <text x="990" y="35" fill="#fff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Publish Changes</text>

  <!-- Left: Toolbox of Draggable Form Elements -->
  <rect x="30" y="80" width="260" height="540" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="115" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Form Elements</text>
  <text x="50" y="135" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Drag or click to insert</text>

  <g font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="50" y="155" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="178">🔤 Short Text Input</text>

    <rect x="50" y="200" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="223">📄 Long Description Area</text>

    <rect x="50" y="245" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="268">🔢 Numeric Field</text>

    <rect x="50" y="290" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="313">📋 Dropdown Select</text>

    <rect x="50" y="335" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="358">☑️ Multi-Checkbox Group</text>

    <rect x="50" y="380" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="403">📎 File / Resume Upload</text>

    <rect x="50" y="425" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="448">📅 Date &amp; Time Picker</text>

    <rect x="50" y="470" width="220" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="493">💳 Pass Tier Selector</text>
  </g>

  <!-- Center: Interactive Form Canvas -->
  <rect x="310" y="80" width="500" height="540" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="335" y="115" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Form Designer Canvas</text>
  
  <!-- Canvas Field 1 -->
  <rect x="335" y="140" width="450" height="75" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="355" y="165" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Full Legal Name *</text>
  <rect x="355" y="175" width="410" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="370" y="193" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">e.g., Prof. Aruna Sharma</text>

  <!-- Canvas Field 2 -->
  <rect x="335" y="230" width="450" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="255" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Institutional Email Address *</text>
  <rect x="355" y="265" width="410" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="370" y="283" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">name@msruas.ac.in</text>

  <!-- Canvas Field 3 -->
  <rect x="335" y="320" width="450" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="345" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Delegate Participation Category</text>
  <rect x="355" y="355" width="410" height="28" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="370" y="373" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11">Faculty Member / Researcher ▾</text>

  <!-- Canvas Field 4 -->
  <rect x="335" y="420" width="450" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="355" y="445" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Upload Presentation Abstract (PDF)</text>
  <rect x="355" y="455" width="410" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="470" y="473" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Choose File or Drop Here</text>

  <!-- Right: Field Property Inspector -->
  <rect x="830" y="80" width="240" height="540" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="850" y="115" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Field Settings</text>
  <text x="850" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">FIELD LABEL</text>
  <rect x="850" y="160" width="200" height="28" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="860" y="178" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11">Full Legal Name</text>

  <text x="850" y="215" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">VALIDATION RULES</text>
  <text x="850" y="240" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">☑ Required Field</text>
  <text x="850" y="265" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">☐ Unique Value Only</text>
  <text x="850" y="290" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">☑ Regex Validation</text>

  <text x="850" y="335" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">AUTO PASS ISSUANCE</text>
  <rect x="850" y="350" width="200" height="35" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="860" y="372" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">Auto-generate QR on submit</text>
</svg>
