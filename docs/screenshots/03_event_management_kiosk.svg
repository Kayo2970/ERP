  <text x="685" y="162" fill="#fff" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">✓</text>
  
  <text x="725" y="145" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">ACCESS GRANTED — VERIFIED PASS</text>
  <text x="725" y="170" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Aarav M. Shenoy</text>
  <text x="725" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Pass ID: LP-2026-9021 • Tier: Delegate (Full Day)</text>
  
  <rect x="665" y="225" width="160" height="24" rx="4" fill="#0f172a"/>
  <text x="745" y="241" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Seat: Row C, No. 14</text>
  
  <rect x="840" y="225" width="175" height="24" rx="4" fill="#0f172a"/>
  <text x="927" y="241" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Check-in: 09:14:22 AM</text>

