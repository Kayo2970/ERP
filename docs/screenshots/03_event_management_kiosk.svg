    <text x="645" y="490">09:14:22 • Aarav M. Shenoy • #LP-9021 • <tspan fill="#10b981">Valid</tspan></text>
    <text x="645" y="520">09:13:58 • Priya Swaminathan • #LP-8812 • <tspan fill="#10b981">Valid</tspan></text>
    <text x="645" y="550">09:12:45 • Vikram R. Patil • #LP-8812 • <tspan fill="#ef4444">Duplicate Scan Blocked</tspan></text>
    <text x="645" y="580">09:11:10 • Sarah Jenkins • #LP-4410 • <tspan fill="#10b981">Valid</tspan></text>
