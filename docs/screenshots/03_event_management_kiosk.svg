  <!-- Left Side: Live Camera Viewfinder -->
  <rect x="40" y="90" width="550" height="520" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
  
  <!-- Camera Viewport / Scanning Bracket -->
