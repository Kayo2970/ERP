<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <defs>
    <linearGradient id="kioskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1100" height="650" rx="12" fill="url(#kioskBg)"/>

  <!-- Top Kiosk Header -->
  <rect x="0" y="0" width="1100" height="60" fill="#1e293b"/>
  <text x="30" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="800" font-size="18">LEADS Scanner Kiosk</text>
