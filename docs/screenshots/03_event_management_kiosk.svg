  <text x="665" y="415" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">384</text>

  <rect x="850" y="360" width="185" height="70" rx="8" fill="#0f172a"/>
  <text x="870" y="385" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">REMAINING EXPECTED</text>
  <text x="870" y="415" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">66</text>

